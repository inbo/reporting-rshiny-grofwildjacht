name: Test Website Reachability

on:
  schedule:
    - cron: '0 * * * *'  # Run every hour
  workflow_dispatch:

jobs:
  test_reachability:
    runs-on: ubuntu-latest
    steps:
      - name: Check faunabeheer.inbo.be status
        id: check_faunabeheer
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" https://faunabeheer.inbo.be)
          echo "status=$status" >> $GITHUB_OUTPUT

      - name: Check wbe.inbo.be status
        id: check_wbe
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" https://wbe.inbo.be)
          echo "status=$status" >> $GITHUB_OUTPUT

      - name: Compile unreachable sites
        id: unreachable_sites
        run: |
          unreachable=""
          faunabeheer_status="${{ steps.check_faunabeheer.outputs.status }}"
          wbe_status="${{ steps.check_wbe.outputs.status }}"
          if [ "$faunabeheer_status" -ge 400 ]; then
            unreachable+="faunabeheer.inbo.be ($faunabeheer_status)\n"
          fi
          if [ "$wbe_status" -ge 400 ]; then
            unreachable+="wbe.inbo.be ($wbe_status)\n"
          fi
          echo -e "unreachable_sites<<EOF\n${unreachable}EOF" >> $GITHUB_OUTPUT

      - name: Send email notification
        if: steps.unreachable_sites.outputs.unreachable_sites != ''
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USER }}
          password: ${{ secrets.EMAIL_PASS }}
          subject: Website(s) not reachable
          body: |
            The following website(s) returned HTTP status 400 or higher:
            ${{ steps.unreachable_sites.outputs.unreachable_sites }}
            Please investigate the issues.
          to: faunabeheer@inbo.be
          from: GitHub Actions
