name: Test Website Reachability

on:
  schedule:
    - cron: '0 * * * *'  # Run every hour
  workflow_dispatch:      # Allow manual triggering

jobs:
  test_reachability:
    runs-on: ubuntu-latest
    steps:
      - name: Check faunabeheer.inbo.be status
        id: check_faunabeheer
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" https://faunabeheer.inbo.be)
          echo "status=$status" >> $GITHUB_OUTPUT

      - name: Check wbe.inbo.be status
        id: check_wbe
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" https://wbe.inbo.be)
          echo "status=$status" >> $GITHUB_OUTPUT

      - name: Compile unreachable sites
        id: unreachable_sites
        run: |
          unreachable=""
          if [ "${{ steps.check_faunabeheer.outputs.status }}" != "200" ]; then
            unreachable+="faunabeheer.inbo.be (${{ steps.check_faunabeheer.outputs.status }})\n"
          fi
          if [ "${{ steps.check_wbe.outputs.status }}" != "200" ]; then
            unreachable+="wbe.inbo.be (${{ steps.check_wbe.outputs.status }})\n"
          fi
          echo -e "unreachable_sites<<EOF\n${unreachable}EOF" >> $GITHUB_OUTPUT

      - name: Send email notification
        if: steps.unreachable_sites.outputs.unreachable_sites != ''
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USER }}
          password: ${{ secrets.EMAIL_PASS }}
          subject: Website(s) not reachable
          body: |
            The following website(s) returned non-200 status:
            ${{ steps.unreachable_sites.outputs.unreachable_sites }}
            Please investigate the issues.
          to: faunabeheer@inbo.be
          from: GitHub Actions
