name: Test Website Reachability

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  test_reachability:
    runs-on: ubuntu-latest
    steps:
      - name: Check faunabeheer.inbo.be status
        id: check_faunabeheer
        uses: lakuapik/gh-actions-http-status@v1
        continue-on-error: true
        with:
          site: https://faunabeheer.inbo.be
          expected: 200

      - name: Check wbe.inbo.be status
        id: check_wbe
        uses: lakuapik/gh-actions-http-status@v1
        continue-on-error: true
        with:
          site: https://wbe.inbo.be
          expected: 200

      - name: Compile unreachable sites
        id: unreachable_sites
        run: |
          unreachable=""
          if [ "${{ steps.check_faunabeheer.outputs.status }}" != "200" ]; then
            unreachable+="faunabeheer.inbo.be (${{ steps.check_faunabeheer.outputs.status }}) "
          fi
          if [ "${{ steps.check_wbe.outputs.status }}" != "200" ]; then
            unreachable+="wbe.inbo.be (${{ steps.check_wbe.outputs.status }}) "
          fi
          echo "unreachable_sites=${unreachable}" >> $GITHUB_OUTPUT

      - name: Send email notification
        if: steps.unreachable_sites.outputs.unreachable_sites != ''
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USER }}
          password: ${{ secrets.EMAIL_PASS }}
          subject: Website(s) not reachable
          body: |
            The following website(s) returned non-200 status:
            ${{ steps.unreachable_sites.outputs.unreachable_sites }}
            Please investigate the issues.
          to: faunabeheer@inbo.be
          from: GitHub Actions
